<svg width="480" height="130" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <clipPath id="roundedRect">
      <rect width="480" height="130" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="480" height="130" rx="16" ry="16" fill="url(#bg)" stroke="#1DB954" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Spotify Icon -->
  <circle cx="48" cy="65" r="24" fill="#1DB954" opacity="0.15"/>
  <text x="48" y="70" font-size="26" text-anchor="middle" font-family="Arial">&#127925;</text>

  <!-- Status label -->
  <text x="85" y="30" font-family="'Courier New', monospace" font-size="10" fill="#1DB954" font-weight="bold" letter-spacing="2">LAST PLAYED</text>

  <!-- Song Title -->
  <text x="85" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Not playing right now</text>

  <!-- Artist -->
  <text x="85" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">—</text>

  <!-- Album -->
  <text x="85" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#484f58">—</text>

  <!-- Animated Bars (bottom right) -->
  <g transform="translate(435, 108)">
    
        <rect x="2" y="14" width="4" height="7" rx="1" fill="#888"/>
        <rect x="8" y="10" width="4" height="11" rx="1" fill="#888"/>
        <rect x="14" y="6" width="4" height="15" rx="1" fill="#888"/>
    
  </g>

  <!-- Green accent line -->
  <rect x="0" y="126" width="480" height="4" rx="2" fill="#1DB954" opacity="0.7"/>
</svg>